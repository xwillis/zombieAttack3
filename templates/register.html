{% extends "base.html" %}
{% block title %}Register - Zombie Attack 3{% endblock %}
{% block content %}
<div class="form-card">
    <h2>🧟 Register</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username (3-64 characters)</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="64" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password (4+ characters)</label>
            <input type="password" id="password" name="password" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
