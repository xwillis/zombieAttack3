# Texas Mountaineers WordPress vhost.
# Front-ends Nginx for php-fpm. WAF-lite rate limits + hardening included.

# Login + xmlrpc rate-limit zones (10 req/min per IP, 5 MB state).
limit_req_zone $binary_remote_addr zone=tm_login:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tm_xmlrpc:5m rate=2r/m;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64m;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # ---- Block sensitive files ----
    location ~ /\.(?!well-known).* { deny all; }
    location ~* /(?:wp-config\.php|readme\.html|license\.txt|xmlrpc\.php\.disabled)$ {
        deny all;
    }
    # Hide internal user-enumeration endpoint from anonymous traffic.
    location = /wp-json/wp/v2/users { return 401; }

    # ---- Rate-limit login + xmlrpc ----
    location = /wp-login.php {
        limit_req zone=tm_login burst=5 nodelay;
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location = /xmlrpc.php {
        limit_req zone=tm_xmlrpc burst=2 nodelay;
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---- Static asset caching ----
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|woff2?|ttf|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---- WordPress pretty perma-links ----
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ---- PHP handler ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }
}
